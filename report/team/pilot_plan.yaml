# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
# Số trong scope và luật dừng chi phí lấy từ report/team/bang_chi_phi.md (A2, A3, B1) của Người 1.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) · tính bằng code, z chính xác
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; n = 1.251 x 2,48 = 3.103 mỗi nhóm
#      = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên hiện có: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 yêu cầu hiệu dụng, và chỉ có 6 cụm (dưới 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) x 0,02) >= 859
#      cho m >= 298,5, tức 299 yêu cầu mỗi nhân viên; DE = 6,96.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20, phân tầng theo depot):
#   1. Đối chứng chạy cùng thời gian: Có. 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên. Bốc thăm bằng code, seed ghi trước ngày bắt đầu, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có. Chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày bắt đầu (file này).
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 20 + 20 nhân viên không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chấp nhận mức chênh phát hiện được là 6 điểm (859 mỗi nhóm, mỗi nhân viên xử lý ít nhất 299 yêu cầu).
#   Số bất lợi: nếu tác động thật chỉ là 5 điểm thì power còn khoảng 0,64 thay vì 0,80. Cần Giám đốc vận hành ký chấp nhận.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Đợt chạy thử: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang: 3,97% (39/982). Chưa có nhóm đối chứng.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu nên không dùng. Chọn: chênh +2 điểm so với đối chứng, kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (2.696 đ = 0,22x, thành công 95,0%) và hang_nang (8.221 đ = 0,69x, thành công 74,1%) [simulated], chạy ở cả 12 depot, đơn vị chia là 40 nhân viên CSKH (20 dùng trợ lý, 20 đối chứng); loại quoc_te (22.515 đ = 1,88x, thành công 27,3%) và doi_tac (10.215 đ = 0,85x, có điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 -> 10 -> 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, theo luồng nhân viên tự làm"
    spillover_risk: "Có: nhân viên chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng, seed bốc thăm và ngày quyết định chốt trong file này trước ngày bắt đầu"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên, hoặc vượt trần tuyệt đối 6%, hoặc có ít nhất 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công, đo gộp noi_dia + hang_nang cả chi phí cố định, > 8.000 đ (so với gốc 4.599 đ trong phạm vi, 4.472 đ chưa gồm chi phí cố định, và kịch bản làm lại x2 là 6.787 đ, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được tăng tỉ lệ rollout hoặc thêm loại yêu cầu ngoài phạm vi đã duyệt cho tới khi PM xác nhận chi phí gộp quay về dưới 8.000 đ"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) trên số yêu cầu được xem lại vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-12"     # bắt đầu 2026-12-07; 3 tuần rollout (đo chỉ số chính 2 tuần ở bước 0.50) cộng 7 ngày theo dõi mở lại
  simulated_inputs:
    - "phut_xem_lai_simulated (cột trong logix_requests.csv)"
    - "phut_lam_lai_simulated (cột trong logix_requests.csv)"
    - "6 phút = 12.000 đ cho một yêu cầu nhân viên tự làm (giả định của lab)"
    - "chi phí cố định 40 triệu đ/tháng (giả định của lab)"
    - "baseline 0,70 và ICC 0,02 (số cho sẵn của đề)"
